services:
  - type: web
    name: fantasy-baseball
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ESPN_LEAGUE_ID
        sync: false
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      - key: SEASON_YEAR
        value: "2026"
      - key: ODDS_API_KEY
        sync: false
