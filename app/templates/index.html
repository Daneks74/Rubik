<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1117">
  <title>Fantasy Baseball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar (desktop) / Bottom tab bar (mobile) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Fantasy Dashboard</h1>
        <div class="league-switcher" id="league-switcher" style="display:none">
          <select id="league-select" class="league-select" onchange="switchLeague(this.value)"></select>
        </div>
        <div class="league-name" id="league-name">Loading...</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-page="sp-picker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          </svg>
          <span>SP Picker</span>
        </div>
        <div class="nav-item" data-page="rankings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>
          </svg>
          <span>Rankings</span>
        </div>
        <div class="nav-item" data-page="my-roster">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Roster</span>
        </div>
        <div class="nav-item" data-page="free-agents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <span>FA</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="refresh-btn" onclick="refreshData()">Refresh Data</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main" id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
